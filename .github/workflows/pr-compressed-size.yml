name: Compressed Size

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  compressed-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: preactjs/compressed-size-action@v2
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          install-script: 'npm install -g pnpm@9 && pnpm install --force'
          build-script: 'npm run init && npm run release:prepare'
          pattern: './npm_dist/**/*.{js,ts,vue,less,css}'
