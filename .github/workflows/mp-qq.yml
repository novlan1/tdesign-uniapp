name: Deploy MP-QQ

on:
 push:
   branches:
   - develop

jobs:
  build-qq-ci: #job名称
    runs-on: ubuntu-latest #运行环境
    steps:
      - name: Checkout 
        uses: actions/checkout@master

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Dependencies
        run: pnpm install --force

      - name: Build
        run: pnpm run init && pnpm run build:mp-qq
      
    # 上传小程序版本到管理端，并将此版本设置为体验版（设置体验版可选）
      - name: Deploy 
        uses: docker://qqminiapp/build:latest 
        env: 
          PLUGIN_VERSION: 1.0.0
          PLUGIN_DESC: CI自动构建上传
          PLUGIN_APPTOKEN: ${{ secrets.MP_QQ_APP_TOKEN }}
          PLUGIN_BUILDUSER: ${{ github.actor }} 
          PLUGIN_EXPERIENCE: true 
          #PLUGIN_PREVIEW: true
          #PLUGIN_FIRSTPAGE: pages/index/index
          #PLUGIN_USEPACKAGEJSON: true
          #PLUGIN_NPMBUILD: true
          PLUGIN_SOURCECODEPATH: ./packages/demo/dist/build/mp-qq
