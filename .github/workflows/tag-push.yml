name: auto-release

on:
  pull_request_target:
    types: [closed]
  push:
   branches:
   - develop


permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install

      - run: pnpm run init && pnpm run release:prepare

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: novlan1/flow-pilot-action@feature/novlan1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: 'tdesign-uniapp,tdesign-uniapp-chat'
