name: Deploy Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'recursive'
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Dependencies
        run: pnpm install --force

      - name: Build
        run: pnpm run build && echo '' > ./packages/site/dist/mobile/.nojekyll 

      - name: Build Chat
        run: pnpm --filter="./packages/site-chat" build
        
      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Upload CDN
        run: node packages/demo/script/deploy/cdn.js ${{ secrets.COS_SECRET_ID }} ${{ secrets.COS_SECRET_KEY }}
      
      - name: Upload CDN of Chat
        run: node packages/demo/script/deploy/cdn.js ${{ secrets.COS_SECRET_ID }} ${{ secrets.COS_SECRET_KEY }} 1
        
      - name: Deploy Mine Cloud
        run: node packages/demo/script/deploy/mine-doc.js ${{ secrets.HOST_NAME }} ${{ secrets.HOST_PWD }}
        shell: bash

      - name: Deploy Mine Cloud of Chat
        run: node packages/demo/script/deploy/mine-doc.js ${{ secrets.HOST_NAME }} ${{ secrets.HOST_PWD }} 1
        shell: bash
