# action 的名称
name: Deploy GitHub Pages

on:
  push:
    branches:
      - develop

# 任务
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'recursive'
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install Dependencies
        run: pnpm install --force

      - name: Build
        run: pnpm run build && echo '' > ./packages/site/dist/mobile/.nojekyll 
        
      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Upload CDN
        run: node packages/demo/script/deploy/cdn.js ${{ secrets.COS_SECRET_ID }} ${{ secrets.COS_SECRET_KEY }}
        
      - name: Deploy Mine Cloud
        run: node packages/demo/script/deploy/mine-doc.js ${{ secrets.HOST_NAME }} ${{ secrets.HOST_PWD }}
        shell: bash

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          BRANCH: docs
          FOLDER: packages/site/dist
